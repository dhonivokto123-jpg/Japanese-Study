<!doctype html>

    <meta charset="UTF-8" />

    <script>
      (function() {
        try {
          var originalFetch = window.fetch;
          var customFetch = originalFetch ? originalFetch.bind(window) : originalFetch;
          
          function patchFetch(target) {
            if (!target) return;
            try {
              Object.defineProperty(target, 'fetch', {
                get: function() {
                  return customFetch;
                },
                set: function(fn) {
                  customFetch = fn;
                },
                configurable: true,
                enumerable: true
              });
            } catch (err) {
              // ignore if target cannot be configured
            }
          }

          patchFetch(window);
          if (typeof Window !== 'undefined' && Window.prototype) {
            patchFetch(Window.prototype);
          }
          if (typeof globalThis !== 'undefined' && globalThis !== window) {
            patchFetch(globalThis);
          }
        } catch (e) {
          // ignore
        }
      })();
    </script>
