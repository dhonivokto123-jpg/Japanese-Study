<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1120" width="800" height="1120">
  <defs>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Clean Paper Sheet Background -->
  <rect width="800" height="1120" fill="#F8FAFC" />
  <rect x="24" y="24" width="752" height="1072" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" filter="url(#card-shadow)" />

  <!-- Sheet Header Bar -->
  <g transform="translate(48, 52)">
    <!-- Page Number Badge -->
    <rect x="0" y="0" width="38" height="38" rx="10" fill="#0F172A" />
    <text x="19" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF">5</text>
    
    <!-- Title -->
    <text x="54" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" fill="#0F172A" letter-spacing="0.5">Grammar Part 1 - Particles</text>
    
    <!-- Red Accent Line -->
    <line x1="0" y1="48" x2="704" y2="48" stroke="#E2E8F0" stroke-width="1.5" />
    <circle cx="700" cy="24" r="5" fill="#E11D48" />
  </g>

  <!-- Diagonal Authentic Watermark -->
  <g transform="translate(400, 560) rotate(-35)" opacity="0.06">
    <text text-anchor="middle" font-family="Impact, Arial Black, sans-serif" font-size="96" font-weight="bold" fill="#0F172A" letter-spacing="8">MAKSUD ALAM</text>
  </g>

  <!-- Content Sections -->
  
        <g transform="translate(48, 130)">
          <rect width="704" height="42" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
          <circle cx="20" cy="21" r="4" fill="#6366F1" />
          <text x="34" y="27" font-family="'Courier New', monospace, sans-serif" font-size="16" font-weight="bold" fill="#1E293B">• Object が Adjective (Continued)</text>
        </g>
      
          <g transform="translate(52, 184)">
            <rect width="696" height="52" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
            <text x="14" y="24" font-family="'Noto Sans JP', 'Hiragino Sans', sans-serif" font-size="15" font-weight="bold" fill="#0F172A">わたし は とりにく が きらいです。</text>
            <text x="14" y="44" font-family="'SolaimanLipi', 'Kalpurush', 'Hind Siliguri', sans-serif" font-size="13" fill="#475569">(আমি মুরগির মাংস অপছন্দ করি)</text>
          </g>
        
          <g transform="translate(52, 244)">
            <rect width="696" height="52" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
            <text x="14" y="24" font-family="'Noto Sans JP', 'Hiragino Sans', sans-serif" font-size="15" font-weight="bold" fill="#0F172A">ミラーさん は テニス が じょうず です。</text>
            <text x="14" y="44" font-family="'SolaimanLipi', 'Kalpurush', 'Hind Siliguri', sans-serif" font-size="13" fill="#475569">(মি. মিলার টেনিস খেলায় পারদর্শী)</text>
          </g>
        
          <g transform="translate(52, 304)">
            <rect width="696" height="52" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
            <text x="14" y="24" font-family="'Noto Sans JP', 'Hiragino Sans', sans-serif" font-size="15" font-weight="bold" fill="#0F172A">にほんの やま の なかで ふじさん が いちばん たかい やまです。</text>
            <text x="14" y="44" font-family="'SolaimanLipi', 'Kalpurush', 'Hind Siliguri', sans-serif" font-size="13" fill="#475569">(জাপানের পাহাড়ের মধ্যে ফুজি সান সবচেয়ে উঁচু পাহাড়)</text>
          </g>
        
        <g transform="translate(48, 388)">
          <rect width="704" height="42" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
          <circle cx="20" cy="21" r="4" fill="#6366F1" />
          <text x="34" y="27" font-family="'Courier New', monospace, sans-serif" font-size="16" font-weight="bold" fill="#1E293B">• N が わかります / わかりません。</text>
        </g>
      
          <text x="52" y="442" font-family="'SolaimanLipi', 'Kalpurush', 'Hind Siliguri', sans-serif" font-size="15" fill="#334155" font-weight="500">যে জিনিস বুঝি বা বুঝি না তারপর が + わかります/わかりません বসে।</text>
        
          <g transform="translate(52, 472)">
            <rect width="696" height="52" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
            <text x="14" y="24" font-family="'Noto Sans JP', 'Hiragino Sans', sans-serif" font-size="15" font-weight="bold" fill="#0F172A">わたし は えいご が わかりません。</text>
            <text x="14" y="44" font-family="'SolaimanLipi', 'Kalpurush', 'Hind Siliguri', sans-serif" font-size="13" fill="#475569">(আমি ইংরেজি ভাষা বুঝি না)</text>
          </g>
        
          <g transform="translate(52, 532)">
            <rect width="696" height="52" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
            <text x="14" y="24" font-family="'Noto Sans JP', 'Hiragino Sans', sans-serif" font-size="15" font-weight="bold" fill="#0F172A">わたし は にほんご が わかります。</text>
            <text x="14" y="44" font-family="'SolaimanLipi', 'Kalpurush', 'Hind Siliguri', sans-serif" font-size="13" fill="#475569">(আমি জাপানি ভাষা বুঝি)</text>
          </g>
        
        <g transform="translate(48, 616)">
          <rect width="704" height="42" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
          <circle cx="20" cy="21" r="4" fill="#6366F1" />
          <text x="34" y="27" font-family="'Courier New', monospace, sans-serif" font-size="16" font-weight="bold" fill="#1E293B">• Person&apos;s/Animals/Things が ほしい。</text>
        </g>
      
          <text x="52" y="670" font-family="'SolaimanLipi', 'Kalpurush', 'Hind Siliguri', sans-serif" font-size="15" fill="#334155" font-weight="500">ほしい অর্থ &apos;চাই&apos;। অর্থাৎ কোনো কিছু চাওয়ার ক্ষেত্রে যেটা চাই তারপর が</text>
        
          <text x="52" y="694" font-family="'SolaimanLipi', 'Kalpurush', 'Hind Siliguri', sans-serif" font-size="15" fill="#334155" font-weight="500">Particle বসে। অন্যভাবে বলা যায়, ほしい এর আগে が Particle বসে।</text>
        
          <g transform="translate(52, 724)">
            <rect width="696" height="52" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
            <text x="14" y="24" font-family="'Noto Sans JP', 'Hiragino Sans', sans-serif" font-size="15" font-weight="bold" fill="#0F172A">わたし は くるま が ほしい です。</text>
            <text x="14" y="44" font-family="'SolaimanLipi', 'Kalpurush', 'Hind Siliguri', sans-serif" font-size="13" fill="#475569">(আমি গাড়ি চাই)</text>
          </g>
        
          <g transform="translate(52, 784)">
            <rect width="696" height="52" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
            <text x="14" y="24" font-family="'Noto Sans JP', 'Hiragino Sans', sans-serif" font-size="15" font-weight="bold" fill="#0F172A">ミラーさん の つかった シャツ が ほしい です。</text>
            <text x="14" y="44" font-family="'SolaimanLipi', 'Kalpurush', 'Hind Siliguri', sans-serif" font-size="13" fill="#475569">(মি. মিলারের ব্যবহার করা শার্ট চাই)</text>
          </g>
        
          <g transform="translate(52, 844)">
            <rect width="696" height="52" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
            <text x="14" y="24" font-family="'Noto Sans JP', 'Hiragino Sans', sans-serif" font-size="15" font-weight="bold" fill="#0F172A">にほんご の ほん が ほしいです。</text>
            <text x="14" y="44" font-family="'SolaimanLipi', 'Kalpurush', 'Hind Siliguri', sans-serif" font-size="13" fill="#475569">(জাপানি ভাষার বই চাই)</text>
          </g>
        
          <g transform="translate(52, 904)">
            <rect width="696" height="52" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
            <text x="14" y="24" font-family="'Noto Sans JP', 'Hiragino Sans', sans-serif" font-size="15" font-weight="bold" fill="#0F172A">パソコン が ほしい です。</text>
            <text x="14" y="44" font-family="'SolaimanLipi', 'Kalpurush', 'Hind Siliguri', sans-serif" font-size="13" fill="#475569">(পার্সোনাল কম্পিউটার চাই)</text>
          </g>
        

  <!-- Footer Note (if any) -->
  

