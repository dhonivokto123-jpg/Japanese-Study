<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1120" width="800" height="1120">
  <defs>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Clean Paper Sheet Background -->
  <rect width="800" height="1120" fill="#F8FAFC" />
  <rect x="24" y="24" width="752" height="1072" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" filter="url(#card-shadow)" />

  <!-- Sheet Header Bar -->
  <g transform="translate(48, 52)">
    <!-- Page Number Badge -->
    <rect x="0" y="0" width="38" height="38" rx="10" fill="#0F172A" />
    <text x="19" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF">3</text>
    
    <!-- Title -->
    <text x="54" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" fill="#0F172A" letter-spacing="0.5">Grammar Part 1 - Particles</text>
    
    <!-- Red Accent Line -->
    <line x1="0" y1="48" x2="704" y2="48" stroke="#E2E8F0" stroke-width="1.5" />
    <circle cx="700" cy="24" r="5" fill="#E11D48" />
  </g>

  <!-- Diagonal Authentic Watermark -->
  <g transform="translate(400, 560) rotate(-35)" opacity="0.06">
    <text text-anchor="middle" font-family="Impact, Arial Black, sans-serif" font-size="96" font-weight="bold" fill="#0F172A" letter-spacing="8">MAKSUD ALAM</text>
  </g>

  <!-- Content Sections -->
  
        <g transform="translate(48, 130)">
          <rect width="704" height="42" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
          <circle cx="20" cy="21" r="4" fill="#6366F1" />
          <text x="34" y="27" font-family="'Courier New', monospace, sans-serif" font-size="16" font-weight="bold" fill="#1E293B">• Object থেকে Subject + は</text>
        </g>
      
          <text x="52" y="184" font-family="'SolaimanLipi', 'Kalpurush', 'Hind Siliguri', sans-serif" font-size="15" fill="#334155" font-weight="500">বাক্যের Object যখন Subject হয়, তখন Subject এর পর は Particle বসে।</text>
        
          <g transform="translate(52, 214)">
            <rect width="696" height="52" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
            <text x="14" y="24" font-family="'Noto Sans JP', 'Hiragino Sans', sans-serif" font-size="15" font-weight="bold" fill="#0F172A">じむしょ に ミラーさん が います。</text>
            <text x="14" y="44" font-family="'SolaimanLipi', 'Kalpurush', 'Hind Siliguri', sans-serif" font-size="13" fill="#475569">(অফিসে মি. মিলার আছে) [Subject: じむしょ, Object: ミラーさん]</text>
          </g>
        
          <g transform="translate(52, 274)">
            <rect width="696" height="52" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
            <text x="14" y="24" font-family="'Noto Sans JP', 'Hiragino Sans', sans-serif" font-size="15" font-weight="bold" fill="#0F172A">ミラーさん は じむしょ に います。</text>
            <text x="14" y="44" font-family="'SolaimanLipi', 'Kalpurush', 'Hind Siliguri', sans-serif" font-size="13" fill="#475569">(মি. মিলার অফিসে আছে) [Subject: ミラーさん, Object: じむしょ]</text>
          </g>
        
        <g transform="translate(48, 358)">
          <circle cx="10" cy="10" r="7" fill="#E11D48" />
          <text x="26" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" fill="#0F172A">か Particles</text>
        </g>
      
        <g transform="translate(48, 394)">
          <rect width="704" height="42" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
          <circle cx="20" cy="21" r="4" fill="#6366F1" />
          <text x="34" y="27" font-family="'Courier New', monospace, sans-serif" font-size="16" font-weight="bold" fill="#1E293B">• ...ですか。...ますか。(প্রশ্নবোধক বাক্য)</text>
        </g>
      
          <text x="52" y="448" font-family="'SolaimanLipi', 'Kalpurush', 'Hind Siliguri', sans-serif" font-size="15" fill="#334155" font-weight="500">যেকোনো বাক্যের শেষে か Particle বসে বাক্যকে প্রশ্নবোধক বাক্য করা হয়।</text>
        
          <text x="52" y="472" font-family="'SolaimanLipi', 'Kalpurush', 'Hind Siliguri', sans-serif" font-size="15" fill="#334155" font-weight="500">বাক্যের শেষে か Particle থাকা মানেই হচ্ছে প্রশ্নবোধক বাক্য। জাপানি</text>
        
          <text x="52" y="496" font-family="'SolaimanLipi', 'Kalpurush', 'Hind Siliguri', sans-serif" font-size="15" fill="#334155" font-weight="500">ভাষায় প্রশ্নবোধক বাক্য চেনার এটাই সহজ এবং একমাত্র কৌশল।</text>
        
          <g transform="translate(52, 526)">
            <rect width="696" height="52" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
            <text x="14" y="24" font-family="'Noto Sans JP', 'Hiragino Sans', sans-serif" font-size="15" font-weight="bold" fill="#0F172A">あなた の なまえ は なん です か。</text>
            <text x="14" y="44" font-family="'SolaimanLipi', 'Kalpurush', 'Hind Siliguri', sans-serif" font-size="13" fill="#475569">(আপনার নাম কী?)</text>
          </g>
        
          <g transform="translate(52, 586)">
            <rect width="696" height="52" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
            <text x="14" y="24" font-family="'Noto Sans JP', 'Hiragino Sans', sans-serif" font-size="15" font-weight="bold" fill="#0F172A">あなた は なんさい です か。</text>
            <text x="14" y="44" font-family="'SolaimanLipi', 'Kalpurush', 'Hind Siliguri', sans-serif" font-size="13" fill="#475569">(আপনার বয়স কতো?)</text>
          </g>
        
          <g transform="translate(52, 646)">
            <rect width="696" height="52" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
            <text x="14" y="24" font-family="'Noto Sans JP', 'Hiragino Sans', sans-serif" font-size="15" font-weight="bold" fill="#0F172A">あなた は がくせい です か。</text>
            <text x="14" y="44" font-family="'SolaimanLipi', 'Kalpurush', 'Hind Siliguri', sans-serif" font-size="13" fill="#475569">(আপনি কি ছাত্র?)</text>
          </g>
        
        <g transform="translate(48, 730)">
          <rect width="704" height="42" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
          <circle cx="20" cy="21" r="4" fill="#6366F1" />
          <text x="34" y="27" font-family="'Courier New', monospace, sans-serif" font-size="16" font-weight="bold" fill="#1E293B">• ...か...か... (একটি বিষয় নিয়ে একাধিক বিভ্রান্ত/বিকল্প)</text>
        </g>
      
          <text x="52" y="784" font-family="'SolaimanLipi', 'Kalpurush', 'Hind Siliguri', sans-serif" font-size="15" fill="#334155" font-weight="500">আমার সামনে মলাট দেওয়া একটি বই আছে। এখন আমি বিভ্রান্তের মধ্যে আছি,</text>
        
          <text x="52" y="808" font-family="'SolaimanLipi', 'Kalpurush', 'Hind Siliguri', sans-serif" font-size="15" fill="#334155" font-weight="500">এটা কি বই নাকি খাতা। এরকম একটা বিষয় নিয়ে একাধিক বিভ্রান্ত থাকলে</text>
        
          <text x="52" y="832" font-family="'SolaimanLipi', 'Kalpurush', 'Hind Siliguri', sans-serif" font-size="15" fill="#334155" font-weight="500">প্রশ্ন করার সময় ...か...か... অর্থাৎ Double か, か ব্যবহার করা হয়।</text>
        
          <g transform="translate(52, 862)">
            <rect width="696" height="52" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
            <text x="14" y="24" font-family="'Noto Sans JP', 'Hiragino Sans', sans-serif" font-size="15" font-weight="bold" fill="#0F172A">これ は じしょ です か、ほん です か。</text>
            <text x="14" y="44" font-family="'SolaimanLipi', 'Kalpurush', 'Hind Siliguri', sans-serif" font-size="13" fill="#475569">(এটা কি ডিকশনারি নাকি বই?)</text>
          </g>
        
          <g transform="translate(52, 922)">
            <rect width="696" height="52" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
            <text x="14" y="24" font-family="'Noto Sans JP', 'Hiragino Sans', sans-serif" font-size="15" font-weight="bold" fill="#0F172A">この かばん は あなた の です か、ミラーさん の です か。</text>
            <text x="14" y="44" font-family="'SolaimanLipi', 'Kalpurush', 'Hind Siliguri', sans-serif" font-size="13" fill="#475569">(এই ব্যাগটা কি আপনার নাকি মি. মিলারের?)</text>
          </g>
        
          <g transform="translate(52, 982)">
            <rect width="696" height="52" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
            <text x="14" y="24" font-family="'Noto Sans JP', 'Hiragino Sans', sans-serif" font-size="15" font-weight="bold" fill="#0F172A">これ は [ 7 ] です か、[ 9 ] です か。</text>
            <text x="14" y="44" font-family="'SolaimanLipi', 'Kalpurush', 'Hind Siliguri', sans-serif" font-size="13" fill="#475569">(এটা কি ৭ নাকি ৯?)</text>
          </g>
        

  <!-- Footer Note (if any) -->
  

  <!-- Bottom Page Mark -->
  <g transform="translate(48, 1090)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94A3B8">Nihonova Academy · Japanese Particle Research Center · 助詞学習ガイド</text>
    <text x="704" y="0" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="bold" fill="#64748B">Page 3 of 7</text>
  </g>
</svg>
